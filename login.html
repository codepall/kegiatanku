<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | JadwalKu</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body style="overflow: auto; display: flex; justify-content: center; align-items: center; height: 100vh;">
  <div class="login-card glass-panel" style="display: block;">
    <h1>JadwalKu.</h1>
    <p>Kelola waktumu dengan elegan.</p>
    <div class="input-group">
      <label>Alamat Email</label>
      <input type="email" id="login-email" placeholder="contoh@gmail.com" required>
    </div>
    <div class="input-group">
      <label>Kata Sandi</label>
      <input type="password" id="login-password" placeholder="Masukkan kata sandi" required>
    </div>
    <div class="login-actions">
      <!-- Tombol login dibuat penuh (width 100%) -->
      <button id="btn-login" class="btn-primary" style="width: 100%;">Masuk / Login</button>
    </div>
    <p id="login-error"></p>
  </div>
  <script type="module" src="login.js"></script>
</body>
</html>
